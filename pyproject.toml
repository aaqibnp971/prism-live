[project]
name = "prism-live"
version = "0.1.0"
description = "Prism Live host: BLE bridge, beat scheduler, PSV, WebSocket server, tools"
requires-python = ">=3.11"
dependencies = ["websockets>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
audio = ["sounddevice>=0.4", "numpy>=1.26"]  # tools/click_track.py only

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bridge"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bridge/server.py" = ["E402"]  # the run-as-a-module guard has to precede the imports

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
